[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceflow-ai"
version = "0.1.0"
description = "Agentic Medical Device Risk Traceability System powered by GenAI"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ashwini Jadhav", email = "ashwini@example.com"},
]
keywords = ["medical-device", "risk-analysis", "regulatory", "llm", "agentic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "typer[all]>=0.12.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.7.0",
    "rich>=13.0.0",
    "anyio>=4.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "pyright>=1.1.390",
    "black>=23.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
traceflow = "main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "htmlcov",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "RUF"]
ignore = ["E501"]  # Line too long - handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["agents", "output", "prompts", "validators", "orchestrator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = false
omit = [
    "main.py",
    "context.py",
    "orchestrator.py",
    "system_orchestrator.py",
    "output/formatter.py",
    "output/risk_matrix.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = false
precision = 2

[tool.bandit]
exclude_dirs = ["tests", "demo-recordings"]
skips = ["B101"]
severity_level = "medium"
recursive = true

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
ignore = ["demo-recordings", "offline_demo"]
reportMissingImports = true
reportMissingTypeStubs = false
