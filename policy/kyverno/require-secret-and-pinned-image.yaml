apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: traceflow-require-secret-and-pinned-image
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-job-secret-env-and-pinned-image
      match:
        any:
          - resources:
              kinds:
                - Job
              namespaces:
                - traceflow-ai
      validate:
        message: "TraceFlow Jobs must avoid latest tags and source ANTHROPIC_API_KEY from a Secret."
        pattern:
          spec:
            template:
              spec:
                containers:
                  - name: "*"
                    image: "!*:latest"
                    env:
                      - name: ANTHROPIC_API_KEY
                        valueFrom:
                          secretKeyRef:
                            name: "?*"
                            key: ANTHROPIC_API_KEY
    - name: require-cronjob-secret-env-and-pinned-image
      match:
        any:
          - resources:
              kinds:
                - CronJob
              namespaces:
                - traceflow-ai
      validate:
        message: "TraceFlow CronJobs must avoid latest tags and source ANTHROPIC_API_KEY from a Secret."
        pattern:
          spec:
            jobTemplate:
              spec:
                template:
                  spec:
                    containers:
                      - name: "*"
                        image: "!*:latest"
                        env:
                          - name: ANTHROPIC_API_KEY
                            valueFrom:
                              secretKeyRef:
                                name: "?*"
                                key: ANTHROPIC_API_KEY