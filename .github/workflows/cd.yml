name: Container Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'agents/**'
      - 'output/**'
      - 'prompts/**'
      - 'validators/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'main.py'
      - 'orchestrator.py'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/cd.yml'

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    name: Build & Publish Container Image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LOWER}/traceflow-ai
          
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${GITHUB_SHA},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=TraceFlow AI
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Create release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "📦 Container Image Published" > release_notes.md
          echo "" >> release_notes.md
          echo "**Image**: \`ghcr.io/${{ github.repository_owner }}/traceflow-ai:${{ steps.meta.outputs.version }}\`" >> release_notes.md
          echo "**Tags**: ${{ steps.meta.outputs.tags }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "To run the image:" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "docker run -e ANTHROPIC_API_KEY=your-key ghcr.io/${{ github.repository_owner }}/traceflow-ai:${{ steps.meta.outputs.version }}" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
