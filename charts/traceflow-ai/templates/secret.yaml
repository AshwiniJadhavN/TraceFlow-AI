{{- if and (not .Values.anthropic.existingSecret) .Values.anthropic.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "traceflow-ai.secretName" . }}
  labels:
    {{- include "traceflow-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.anthropic.apiKey | quote }}
{{- end }}