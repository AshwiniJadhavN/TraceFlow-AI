apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traceflow-ai-egress
  namespace: traceflow-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traceflow-ai
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4318